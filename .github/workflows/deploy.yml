name: Validate and deploy Treevolution production site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treevolution-production-deploy
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_DIR: ${{ secrets.TREEVOLUTION_PUBLIC_HTML_DIR }}
      SSH_HOST: ${{ secrets.TREEVOLUTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.TREEVOLUTION_SSH_PORT }}
      SSH_USER: ${{ secrets.TREEVOLUTION_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.TREEVOLUTION_SSH_PASSWORD }}
      UPLOAD_USERNAME: ${{ secrets.UPLOAD_USERNAME }}
      UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
      TREEVOLUTION_GITHUB_TOKEN: ${{ secrets.TREEVOLUTION_GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html privacy/index.html cookies/index.html accessibility/index.html terms/index.html
            about/index.html services/index.html our-work/index.html reviews/index.html areas/index.html contact/index.html
            404.html robots.txt sitemap.xml .htaccess
            assets/css/site.css assets/css/client-portal.css assets/css/client-editor.css assets/js/site.js
            client/login.php client/add.php client/manage.php client/submit.php client/bootstrap.php contact/send.php
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts]
          patterns = [
              re.compile(('github' + '_pat_') + r'[A-Za-z0-9_]+'),
              re.compile(('gh' + 'p_') + r'[A-Za-z0-9]+'),
              re.compile(r'-----BEGIN (?:OPENSSH|RSA|EC|DSA) PRIVATE KEY-----'),
          ]
          hits = []
          for path in roots:
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      hits.append(str(path))
                      break
          if hits:
              raise SystemExit('Possible committed secret in: ' + ', '.join(hits))
          PY

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find client contact -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate deployment secrets and production target
        shell: bash
        run: |
          set -euo pipefail
          for name in TARGET_DIR SSH_HOST SSH_PORT SSH_USER SSH_PASSWORD UPLOAD_USERNAME UPLOAD_PASSWORD TREEVOLUTION_GITHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Required secret is missing: $name"
              exit 1
            fi
          done
          case "$TARGET_DIR" in
            */domains/treevolution.uk/public_html|*/domains/treevolution.uk/public_html/) ;;
            *) echo "Safety stop: production workflow only deploys to the Treevolution public_html directory. TARGET_DIR=$TARGET_DIR"; exit 1 ;;
          esac

      - name: Run site and media audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tools/audit_site.py

      - name: Install SSH deployment tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync

      - name: Prepare Website Manager private config
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          owner, repo = os.environ['REPOSITORY'].split('/', 1)
          values = {
              'upload_username': os.environ['UPLOAD_USERNAME'],
              'upload_password': os.environ['UPLOAD_PASSWORD'],
              'github_owner': owner,
              'github_repo': repo,
              'github_branch': 'main',
              'github_token': os.environ['TREEVOLUTION_GITHUB_TOKEN'],
          }

          def php_quote(value: str) -> str:
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          lines = ["<?php", "// Generated by GitHub Actions. Never commit this file.", "return ["]
          for key, value in values.items():
              lines.append(f"  {php_quote(key)} => {php_quote(value)},")
          lines += ["];"]
          Path('/tmp/treevolution-private-config.php').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          chmod 600 /tmp/treevolution-private-config.php

      - name: Diagnose SSH reachability and add host key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          : > ~/.ssh/known_hosts

          echo "SSH target: ${SSH_HOST}:${SSH_PORT}"
          echo "Runner public IP:"
          curl --fail --silent --show-error --max-time 10 https://api.ipify.org || true
          echo

          echo "Testing TCP connectivity to SSH port..."
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${SSH_HOST}/${SSH_PORT}" 2>/dev/null; then
            echo "TCP connection to ${SSH_HOST}:${SSH_PORT} succeeded."
          else
            echo "::warning::Initial TCP connection to ${SSH_HOST}:${SSH_PORT} did not succeed within 15 seconds."
          fi

          echo "Collecting SSH host key with retries..."
          keyscan_ok=0
          for attempt in 1 2 3; do
            echo "ssh-keyscan attempt ${attempt}/3..."
            if timeout 40 ssh-keyscan -T 30 -p "$SSH_PORT" -H "$SSH_HOST" > /tmp/treevolution-known-hosts 2>/tmp/treevolution-keyscan.err; then
              if [ -s /tmp/treevolution-known-hosts ]; then
                cat /tmp/treevolution-known-hosts >> ~/.ssh/known_hosts
                keyscan_ok=1
                break
              fi
            fi

            echo "Attempt ${attempt} returned no host key."
            if [ -s /tmp/treevolution-keyscan.err ]; then
              sed 's/^/ssh-keyscan: /' /tmp/treevolution-keyscan.err
            fi
            sleep 5
          done

          if [ "$keyscan_ok" -ne 1 ]; then
            echo "::error::GitHub Actions could not obtain an SSH host key from ${SSH_HOST}:${SSH_PORT} after 3 attempts."
            echo "::error::This is a network/reachability failure before username or password authentication."
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts
          echo "SSH host key collected successfully."

      - name: Deploy website to Hostinger production directory
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          SSH="sshpass -e ssh -p $SSH_PORT -o BatchMode=no"
          RSYNC_SSH="sshpass -e ssh -p $SSH_PORT -o BatchMode=no"

          # Keep the server as clean as the repository: remove the retired updater first.
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$TARGET_DIR' '$TARGET_DIR/client' && rm -rf '$TARGET_DIR/client-update'"

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'tools/' \
            --exclude 'README.md' \
            --exclude 'client/config.example.php' \
            --exclude 'client/.treevolution-config.php' \
            -e "$RSYNC_SSH" \
            ./ "$SSH_USER@$SSH_HOST:$TARGET_DIR/"

          sshpass -e scp -P "$SSH_PORT" -o BatchMode=no \
            /tmp/treevolution-private-config.php \
            "$SSH_USER@$SSH_HOST:$TARGET_DIR/client/.treevolution-config.php"

          $SSH "$SSH_USER@$SSH_HOST" \
            "chmod 600 '$TARGET_DIR/client/.treevolution-config.php' && \
             find '$TARGET_DIR' -type d -exec chmod 755 {} \; && \
             find '$TARGET_DIR' -type f ! -name '.treevolution-config.php' -exec chmod 644 {} \; && \
             test ! -e '$TARGET_DIR/client-update'"

      - name: Verify Website Manager private config on server
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          SSH="sshpass -e ssh -p $SSH_PORT -o BatchMode=no"
          CONFIG="$TARGET_DIR/client/.treevolution-config.php"

          $SSH "$SSH_USER@$SSH_HOST" \
            "test -d '$TARGET_DIR/client' && \
             test -s '$CONFIG' && \
             test -r '$CONFIG' && \
             grep -q \"'upload_username'\" '$CONFIG' && \
             grep -q \"'upload_password'\" '$CONFIG' && \
             grep -q \"'github_owner'\" '$CONFIG' && \
             grep -q \"'github_repo'\" '$CONFIG' && \
             grep -q \"'github_branch'\" '$CONFIG' && \
             grep -q \"'github_token'\" '$CONFIG'"

          echo "Website Manager private config exists, is non-empty, and contains all required keys."

      - name: Smoke test deployed site and Website Manager
        shell: bash
        env:
          DEPLOY_URL: ${{ vars.TREEVOLUTION_DEPLOY_URL }}
        run: |
          set -euo pipefail
          URL="${DEPLOY_URL:-https://treevolution.uk/}"
          CLIENT_URL="${URL%/}/client/login.php"

          echo "Checking $URL"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 "$URL" > /tmp/treevolution-home.html
          grep -Fq 'Tree Surgeons Lewes &amp; Sussex' /tmp/treevolution-home.html
          grep -Fq 'Treevolution Professional Tree Care' /tmp/treevolution-home.html
          grep -Fq 'site.css?v=20260812-0715' /tmp/treevolution-home.html
          curl --fail --silent --show-error --location "${URL%/}/privacy/" >/dev/null

          echo "Checking deployed responsive stylesheet"
          CSS_URL="${URL%/}/assets/css/site.css?v=20260812-0715"
          CSS_TYPE="$(curl --fail --silent --show-error --location -o /tmp/treevolution-site.css -w '%{content_type}' "$CSS_URL")"
          case "$CSS_TYPE" in
            text/css*) ;;
            *) echo "Stylesheet returned unexpected Content-Type: $CSS_TYPE"; exit 1 ;;
          esac
          grep -Fq '@media(max-width:650px)' /tmp/treevolution-site.css
          grep -Fq '.nav-toggle{display:none' /tmp/treevolution-site.css

          echo "Checking retired client-update URL redirects to the Website Manager"
          LEGACY_FINAL_URL="$(curl --fail --silent --show-error --location -o /dev/null -w '%{url_effective}' "${URL%/}/client-update/login.php")"
          case "$LEGACY_FINAL_URL" in
            */client/|*/client/index.php|*/client/login.php) ;;
            *) echo "Legacy client-update URL did not redirect into /client/: $LEGACY_FINAL_URL"; exit 1 ;;
          esac

          echo "Checking Website Manager at $CLIENT_URL"
          HTTP_CODE="$(curl --silent --show-error --location --retry 3 --retry-delay 3 -o /tmp/treevolution-client.html -w '%{http_code}' "$CLIENT_URL")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Website Manager returned HTTP $HTTP_CODE"
            cat /tmp/treevolution-client.html
            exit 1
          fi
          if grep -q 'Website Manager is not configured yet' /tmp/treevolution-client.html; then
            echo 'Website Manager configuration was not found by the live PHP application.'
            exit 1
          fi
          grep -q 'Welcome back' /tmp/treevolution-client.html
          grep -q 'Sign in' /tmp/treevolution-client.html
          echo "Deployment and Website Manager smoke tests passed."
