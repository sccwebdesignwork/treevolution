name: Validate and deploy Treevolution test site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treevolution-test-deploy
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_DIR: ${{ secrets.TREEVOLUTION_PUBLIC_HTML_DIR }}
      SSH_HOST: ${{ secrets.TREEVOLUTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.TREEVOLUTION_SSH_PORT }}
      SSH_USER: ${{ secrets.TREEVOLUTION_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.TREEVOLUTION_SSH_PASSWORD }}
      UPLOAD_USERNAME: ${{ secrets.UPLOAD_USERNAME }}
      UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
      TREEVOLUTION_GITHUB_TOKEN: ${{ secrets.TREEVOLUTION_GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html privacy/index.html cookies/index.html accessibility/index.html terms/index.html
            about/index.html services/index.html our-work/index.html reviews/index.html areas/index.html contact/index.html
            404.html robots.txt sitemap.xml .htaccess
            assets/css/treevolution-v6-4.css assets/js/treevolution-v6-4.js
            client-update/login.php client-update/index.php client-update/submit.php contact/send.php
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          ! grep -R --exclude-dir=.git -E 'github_pat_|ghp_[A-Za-z0-9]+' .
          ! grep -R --exclude-dir=.git -E 'TREEVOLUTION_SSH_PASSWORD\s*[:=].+[^}]' . || true

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find client-update contact -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate deployment secrets and staging target
        shell: bash
        run: |
          set -euo pipefail
          for name in TARGET_DIR SSH_HOST SSH_PORT SSH_USER SSH_PASSWORD UPLOAD_USERNAME UPLOAD_PASSWORD TREEVOLUTION_GITHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Required secret is missing: $name"
              exit 1
            fi
          done
          case "$TARGET_DIR" in
            */test|*/test/) ;;
            *) echo "Safety stop: staging workflow only deploys to a /test directory. TARGET_DIR=$TARGET_DIR"; exit 1 ;;
          esac

      - name: Run site and media audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tools/audit_site.py

      - name: Install SSH deployment tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync

      - name: Prepare client updater private config
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          owner, repo = os.environ['REPOSITORY'].split('/', 1)
          values = {
              'upload_username': os.environ['UPLOAD_USERNAME'],
              'upload_password': os.environ['UPLOAD_PASSWORD'],
              'github_owner': owner,
              'github_repo': repo,
              'github_branch': 'main',
              'github_token': os.environ['TREEVOLUTION_GITHUB_TOKEN'],
          }

          def php_quote(value: str) -> str:
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          lines = ["<?php", "// Generated by GitHub Actions. Never commit this file.", "return ["]
          for key, value in values.items():
              lines.append(f"  {php_quote(key)} => {php_quote(value)},")
          lines += ["];"]
          Path('/tmp/treevolution-private-config.php').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          chmod 600 /tmp/treevolution-private-config.php

      - name: Add SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy website to Hostinger test directory
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          SSH="sshpass -e ssh -p $SSH_PORT -o BatchMode=no"
          RSYNC_SSH="sshpass -e ssh -p $SSH_PORT -o BatchMode=no"

          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$TARGET_DIR' '$TARGET_DIR/client-update'"

          rsync -az --delete             --exclude '.git/'             --exclude '.github/'             --exclude 'docs/'             --exclude 'README.md'             --exclude 'AUDIT-NOTES.md'             --exclude 'client-update/config.example.php'             --exclude 'client-update/.treevolution-config.php'             -e "$RSYNC_SSH"             ./ "$SSH_USER@$SSH_HOST:$TARGET_DIR/"

          sshpass -e scp -P "$SSH_PORT" -o BatchMode=no             /tmp/treevolution-private-config.php             "$SSH_USER@$SSH_HOST:$TARGET_DIR/client-update/.treevolution-config.php"

          $SSH "$SSH_USER@$SSH_HOST"             "chmod 600 '$TARGET_DIR/client-update/.treevolution-config.php' && find '$TARGET_DIR' -type d -exec chmod 755 {} \; && find '$TARGET_DIR' -type f ! -name '.treevolution-config.php' -exec chmod 644 {} \;"

      - name: Verify client updater private config on server
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          SSH="sshpass -e ssh -p $SSH_PORT -o BatchMode=no"
          CONFIG="$TARGET_DIR/client-update/.treevolution-config.php"

          $SSH "$SSH_USER@$SSH_HOST" "
            set -e
            test -d '$TARGET_DIR/client-update'
            test -f '$CONFIG'
            test -r '$CONFIG'
            php -r '\$c=require '\''$CONFIG'\''; foreach (["upload_username","upload_password","github_owner","github_repo","github_branch","github_token"] as \$k) { if (!isset(\$c[\$k]) || \$c[\$k] === "") { fwrite(STDERR, "Missing config key: \$k\\n"); exit(1); } }'
            echo 'Client updater private config exists and is readable.'
          "

      - name: Smoke test deployed site and client updater
        shell: bash
        env:
          DEPLOY_URL: ${{ vars.TREEVOLUTION_DEPLOY_URL }}
        run: |
          set -euo pipefail
          URL="${DEPLOY_URL:-https://treevolution.uk/test/}"
          CLIENT_URL="${URL%/}/client-update/login.php"

          echo "Checking $URL"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 "$URL" > /tmp/treevolution-home.html
          grep -q '<title>Tree Surgeon Lewes & Sussex | Treevolution Professional Tree Care</title>' /tmp/treevolution-home.html
          curl --fail --silent --show-error --location "${URL%/}/privacy/" >/dev/null

          echo "Checking client updater at $CLIENT_URL"
          HTTP_CODE="$(curl --silent --show-error --location --retry 3 --retry-delay 3 -o /tmp/treevolution-client.html -w '%{http_code}' "$CLIENT_URL")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Client updater returned HTTP $HTTP_CODE"
            cat /tmp/treevolution-client.html
            exit 1
          fi
          if grep -q 'Client updater is not configured yet' /tmp/treevolution-client.html; then
            echo 'Client updater configuration was not found by the live PHP application.'
            exit 1
          fi
          grep -q 'Treevolution client update' /tmp/treevolution-client.html
          grep -q 'Sign in' /tmp/treevolution-client.html
          echo "Deployment and client updater smoke tests passed."
